<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap');
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    .bubble { font-weight:800; filter: drop-shadow(0 4px 0 rgba(0,0,0,.10)); }
    .bubble-blue { background:linear-gradient(180deg, #3FC1F5 0%, #1D6FD1 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .tile { width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:10px; display:block; }
    .legend { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700; }
    .dot { width:12px; height:12px; border-radius:50%; display:inline-block; }
  </style>
</helmet>

    <span class="bubble bubble-blue">Every episode, every frame, generated.</span>
  </h1>

    <div style="border:3px solid #1D6FD1; border-radius:13px; padding:2px;"><img class="tile" src="epA_7.jpg" alt="Episode A frame"/></div>

    <div style="border:3px solid #3FA036; border-radius:13px; padding:2px;"><img class="tile" src="epB_0.jpg" alt="Episode B frame"/></div>
    <div style="border:3px solid #3FA036; border-radius:13px; padding:2px;"><img class="tile" src="epB_1.jpg" alt="Episode B frame"/></div>
