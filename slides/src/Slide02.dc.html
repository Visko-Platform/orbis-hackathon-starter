<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap');
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    .bubble { font-weight:800; filter: drop-shadow(0 5px 0 rgba(0,0,0,.18)); }
    .bubble-white { color:#FFFFFF; }
    .bubble-green { background:linear-gradient(180deg, #C8F09A 0%, #8FD13F 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  </style>
</helmet>
<section style="position:relative; width:100%; height:100vh; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:70px 120px; background:linear-gradient(165deg, #3FC1F5 0%, #1D6FD1 100%); text-align:center; font-family:'Baloo 2', system-ui, sans-serif;">

  <div style="position:absolute; inset:0; background-image: radial-gradient(rgba(255,255,255,.6) 2px, transparent 2px); background-size: 38px 38px; opacity:.14;"></div>

  <svg width="96" height="72" viewBox="0 0 120 90" style="position:relative; margin-bottom:26px; filter: drop-shadow(0 4px 0 rgba(0,0,0,.15));">
    <path d="M10 30 L22 38" stroke="#C8F09A" stroke-width="5" stroke-linecap="round"/>
    <path d="M6 46 L20 48" stroke="#C8F09A" stroke-width="5" stroke-linecap="round"/>
    <path d="M110 30 L98 38" stroke="#C8F09A" stroke-width="5" stroke-linecap="round"/>
    <path d="M114 46 L100 48" stroke="#C8F09A" stroke-width="5" stroke-linecap="round"/>
    <polygon points="60,10 78,45 60,80 42,45" fill="#8FD13F"/>
    <polygon points="60,10 78,45 60,45" fill="#B6E37A"/>
    <polygon points="42,45 60,45 60,80" fill="#3FA036"/>
  </svg>

  <h1 style="position:relative; font-size:52px; font-weight:800; line-height:1.22; margin:0 0 22px; max-width:900px;">
    <span class="bubble bubble-white">We want AI to follow us around and help us.</span>
  </h1>
  <h1 style="position:relative; font-size:52px; font-weight:800; line-height:1.22; margin:0; max-width:820px;">
    <span class="bubble bubble-green">But what if it did? Does AI actually know how to live?</span>
  </h1>

</section>
</x-dc>
</body>
</html>
