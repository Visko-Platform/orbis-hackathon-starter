<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Family World — photo-forward gallery (spike 011)</title>
<style>
  :root { --ink: #f2ece1; --ink-dim: #cabfaf; --brand: #d98e3f; --brand-fg: #1a1208; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0a09; color: var(--ink); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }

  .head { text-align: center; padding: 28px 20px 6px; }
  .head h1 { font-size: clamp(24px, 6vw, 36px); letter-spacing: 0.08em; margin: 0 0 6px; }
  .head p { color: var(--ink-dim); font-size: 13px; margin: 0; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 3px; padding: 16px; }
  .tile {
    position: relative; aspect-ratio: 3/4; overflow: hidden; cursor: pointer; background: #000;
  }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.2s; }
  .tile:hover img { transform: scale(1.04); }
  .tile::after {
    content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 55%);
  }
  .tile .info { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; padding: 12px; }
  .tile .name { font-size: 16px; font-weight: 700; margin: 0; }
  .tile .meta { font-size: 11px; color: var(--ink-dim); margin: 2px 0 0; }
  .tile .seed-dot { position: absolute; top: 8px; left: 8px; z-index: 1; font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em; background: rgba(0,0,0,0.55); padding: 3px 7px; border-radius: 999px; }
  .tile .remove-x { position: absolute; top: 8px; right: 8px; z-index: 1; background: rgba(0,0,0,0.55); border: none; color: var(--ink-dim); width: 22px; height: 22px; border-radius: 999px; cursor: pointer; font-size: 12px; }
  .tile .remove-x:hover { color: #d9603f; }

  .add-tile {
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px;
    background: #17140f; border: 1px dashed #2c2620; color: var(--ink-dim);
  }
  .add-tile .plus { font-size: 26px; color: var(--brand); }

  .note { max-width: 560px; margin: 4px auto 30px; text-align: center; font-size: 12px; color: var(--ink-dim); padding: 0 20px; line-height: 1.6; }
</style>
</head>
<body>
  <div class="head">
    <h1>FAMILY WORLD</h1>
    <p>Photo-forward gallery — spike 011 comparison variant</p>
  </div>
  <div class="grid" id="grid"></div>
  <p class="note">Same underlying data as spikes 008/009/010 (memory.js / worldProvider.js / gallery.js,
  reused unmodified) — only the presentation layer changed.</p>

<script type="module">
  import { deleteMemory } from "../008-creation-screen-memory-contract/memory.js";
  import { ensureSeedsInStorage } from "../010-family-gallery-full-loop/gallery.js";

  function render() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    const family = ensureSeedsInStorage();

    family.forEach((m) => {
      const tile = document.createElement("div");
      tile.className = "tile";
      tile.innerHTML = `
        <img src="${m.photo}" alt="${m.person}" />
        ${m.seed ? '<span class="seed-dot">Example</span>' : '<button class="remove-x">&times;</button>'}
        <div class="info">
          <p class="name">${m.person}</p>
          <p class="meta">${m.place} &middot; ${m.year}</p>
        </div>
      `;
      tile.addEventListener("click", () => {
        location.href = `world.html?memoryId=${encodeURIComponent(m.id)}`;
      });
      const removeBtn = tile.querySelector(".remove-x");
      if (removeBtn) {
        removeBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          deleteMemory(m.id);
          render();
        });
      }
      grid.appendChild(tile);
    });

    const addTile = document.createElement("div");
    addTile.className = "tile add-tile";
    addTile.innerHTML = `<div class="plus">+</div><div>Add Someone</div>`;
    addTile.addEventListener("click", () => (location.href = "create.html"));
    grid.appendChild(addTile);
  }

  render();
</script>
</body>
</html>
